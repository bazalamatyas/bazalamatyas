name: cards

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cards
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_CARDS_TOKEN: ${{ secrets.CARDS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Check out the card source
        uses: actions/checkout@v5
        with:
          repository: bazalamatyas/profile-cards
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          path: src

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Collect aggregates (optional CARDS_TOKEN)
        if: env.HAS_CARDS_TOKEN == 'true'
        continue-on-error: true
        working-directory: src
        env:
          CARDS_TOKEN: ${{ secrets.CARDS_TOKEN }}
        run: python scripts/collect_stats.py > /dev/null && echo "aggregates refreshed"

      - name: Merge the contribution calendar
        working-directory: src
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_contributions.py

      - name: Render
        working-directory: src
        run: python scripts/render_readme_cards.py

      - name: Save merged data to the source
        working-directory: src
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then echo "data unchanged"; exit 0; fi
          git commit -m "chore(data): refresh $(date -u +%F)"
          git push || { git pull --rebase && git push; }

      - name: Publish README.md and cards/
        run: |
          rm -rf cards
          cp -R src/public/cards cards
          cp src/public/README.md README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git add --all -- README.md cards
          if git diff --cached --quiet; then echo "profile unchanged"; exit 0; fi
          git commit -m "Refresh profile cards $(date -u +%F)"
          git push
